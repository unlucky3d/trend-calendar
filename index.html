<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방송 트렌드 달력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 상단 바 + 왼쪽 메뉴 + 본문(월 달력 → 선택한 날의 트렌드 카드 그리드). 방송 플랫폼 홈처럼 흰 바탕, 파란 강조, 둥근 칩 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --line:#e3e6ec; --fg:#17191f; --muted:#6b7280;
  --accent:#0f5ee8; --accent-soft:#e6efff; --accent-fg:#ffffff;
  --live:#f0353c; --chip:#eef0f4; --bar:#cfe0ff;
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#181b21; --line:#2a2e37; --fg:#eceef2; --muted:#9aa1ad;
  --accent:#5b93ff; --accent-soft:#1b2a4a; --accent-fg:#0b0d11;
  --live:#ff5a60; --chip:#242831; --bar:#23386a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#181b21; --line:#2a2e37; --fg:#eceef2; --muted:#9aa1ad;
  --accent:#5b93ff; --accent-soft:#1b2a4a; --accent-fg:#0b0d11;
  --live:#ff5a60; --chip:#242831; --bar:#23386a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--live);display:inline-block}
.updated{margin-left:auto;color:var(--muted);font-size:12px}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);max-width:1400px;margin:0 auto}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);align-self:start;padding:16px 8px 16px 16px;display:flex;flex-direction:column;gap:2px}
nav a{padding:9px 12px;border-radius:8px;font-weight:500}
nav a:hover{background:var(--chip);color:var(--fg)}
nav .sub{margin:14px 12px 6px;font-size:12px;color:var(--muted);font-weight:700}
nav .up{padding:6px 12px;font-size:12px;display:flex;flex-direction:column}
nav .up b{font-weight:500}
nav .up span{color:var(--muted)}
main{padding:16px;display:flex;flex-direction:column;gap:20px;min-width:0}
h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.02em}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px;font-size:12px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.day{min-height:92px;padding:6px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;
  display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.38}
.day:hover{background:var(--chip)}
.day .n{font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day.today .n span{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px}
.day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.g{font-size:11px;line-height:1.3;background:var(--chip);border-radius:4px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.g.kr{background:var(--accent-soft);color:var(--accent)}
.more{font-size:11px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.tag{font-size:10px;font-weight:800;background:var(--live);color:#fff;border-radius:3px;padding:1px 5px;letter-spacing:.04em}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:baseline}
li .r{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
li .t{overflow-wrap:anywhere;font-weight:500}
li .s{display:block;color:var(--muted);font-size:12px;font-weight:400}
li .v{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
li.bar{position:relative;padding:3px 6px;border-radius:5px;overflow:hidden}
li.bar::before{content:"";position:absolute;inset:0;width:var(--w);background:var(--bar);z-index:0}
li.bar>*{position:relative}
.summary{background:var(--accent-soft);border-radius:12px;padding:12px 14px;white-space:pre-line}
.empty{color:var(--muted);padding:18px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.rel{display:flex;flex-direction:column;gap:8px}
.rel div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rel b{font-weight:700}
.rel span{color:var(--muted);font-size:12px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{position:static;flex-direction:row;overflow-x:auto;padding:8px 16px 0}
  nav a{white-space:nowrap}
  nav .sub,nav .up{display:none}
  .day{min-height:64px;padding:4px}
  .g{font-size:10px;padding:1px 3px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i></i>방송 트렌드 달력</div>
  <div class="updated" id="updated">불러오는 중</div>
</header>
<div class="shell">
  <nav aria-label="메뉴">
    <a href="#calendar">달력</a>
    <a href="#soop">SOOP 트렌드</a>
    <a href="#korea">한국 트렌드</a>
    <div class="sub">다가오는 신작</div>
    <div id="upcoming"></div>
  </nav>
  <main>
    <section id="calendar">
      <div class="head" style="margin-bottom:10px">
        <h2 id="ym"></h2><span class="sp"></span>
        <button class="btn" id="prev" aria-label="이전 달">‹</button>
        <button class="btn" id="todayBtn">오늘</button>
        <button class="btn" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="cal">
        <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="legend" style="margin-top:8px">
        <span><i class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block"></i>트렌드 기록 있음</span>
        <span><i class="g kr" style="display:inline-block">국산</i>국내 게임사 신작</span>
        <span><i class="g" style="display:inline-block">해외</i>해외 신작</span>
      </div>
    </section>
    <section>
      <div class="head" style="margin-bottom:10px"><h2 id="selTitle"></h2></div>
      <div id="dayBody" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const pad=n=>String(n).padStart(2,'0');
const kstToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());
const state={today:kstToday(),sel:kstToday(),games:[],snaps:{},ready:false,err:''};
let [vy,vm]=state.today.split('-').map(Number);
const num=n=>typeof n==='number'?n.toLocaleString('ko-KR'):(n||'');
const safeUrl=u=>typeof u==='string'&&/^https:\/\//.test(u)?u:null;
const arr=x=>Array.isArray(x)?x:[];

function gamesOn(d){return state.games.filter(g=>g.date===d)}

let renderCal=function(){
  $('ym').textContent=vy+'년 '+vm+'월';
  const grid=$('grid');grid.replaceChildren();
  const first=new Date(Date.UTC(vy,vm-1,1));
  const start=new Date(first);start.setUTCDate(1-first.getUTCDay());
  const last=new Date(Date.UTC(vy,vm,0));
  const cells=Math.ceil((first.getUTCDay()+last.getUTCDate())/7)*7;
  for(let i=0;i<cells;i++){
    const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);
    const key=d.toISOString().slice(0,10);
    const b=el('button','day');b.type='button';
    if(d.getUTCMonth()!==vm-1)b.classList.add('out');
    if(key===state.today)b.classList.add('today');
    if(key===state.sel)b.classList.add('sel');
    const n=el('div','n');n.append(el('span','',d.getUTCDate()));
    if(state.snaps[key])n.append(el('i','dot'));
    b.append(n);
    const gs=gamesOn(key);
    gs.slice(0,3).forEach(g=>{const c=el('div','g'+(g.korean?' kr':''),g.title);c.title=g.title;b.append(c)});
    if(gs.length>3)b.append(el('div','more','+'+(gs.length-3)+'개'));
    b.setAttribute('aria-label',key+(gs.length?' 출시 '+gs.length+'개':''));
    b.onclick=()=>{state.sel=key;render()};
    grid.append(b);
  }
};

function listCard(title,sub,items,row,live){
  const c=el('div','card');const h=el('h3');
  if(live)h.append(el('span','tag','LIVE'));
  h.append(document.createTextNode(title));if(sub)h.append(el('small','',sub));
  c.append(h);
  if(!items.length){c.append(el('div','s','기록이 없습니다'));c.lastChild.style.color='var(--muted)';return c}
  const ol=el('ol');items.forEach((it,i)=>ol.append(row(it,i)));c.append(ol);return c;
}
function row(i,title,sub,val,url,barW){
  const li=el('li',barW!=null?'bar':'');if(barW!=null)li.style.setProperty('--w',barW+'%');
  li.append(el('span','r',i+1));
  const u=safeUrl(url);const t=el(u?'a':'span','t',title||'');
  if(u){t.href=u;t.target='_blank';t.rel='noopener'}
  if(sub)t.append(el('span','s',sub));
  li.append(t,el('span','v',val||''));return li;
}

function renderDay(){
  const [y,m,d]=state.sel.split('-').map(Number);
  const dow='일월화수목금토'[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  $('selTitle').textContent=m+'월 '+d+'일 ('+dow+')'+(state.sel===state.today?' · 오늘':'');
  const body=$('dayBody');body.replaceChildren();
  const gs=gamesOn(state.sel);
  if(gs.length){
    const c=el('div','card');c.append(el('h3','','이날 출시되는 게임'));
    const r=el('div','rel');
    gs.forEach(g=>{const row=el('div');row.append(el('b','',g.title));
      row.append(el('span','',[g.type,g.platforms,g.publisher].filter(Boolean).join(' · ')));
      if(g.note)row.append(el('span','',g.note));r.append(row)});
    c.append(r);body.append(c);
  }
  const s=state.snaps[state.sel];
  if(!s){
    body.append(el('div','empty',!state.ready?(state.err||'트렌드 기록을 불러오는 중입니다')
      :state.sel>state.today?'아직 오지 않은 날입니다. 출시 일정만 표시됩니다.'
      :'이날 수집된 트렌드 기록이 없습니다. 기록은 매시간 자동 수집되며 수집을 시작한 날부터 쌓입니다.'));
    return;
  }
  if(s.summary)body.append(el('div','summary',s.summary));
  const cats=arr(s.soopCategories),maxV=Math.max(1,...cats.map(c=>+c.viewers||0));
  const soop=el('div','cards');soop.id='soop';
  soop.append(
    listCard('SOOP 인기 카테고리','시청자 수',cats.slice(0,15),(c,i)=>row(i,c.name,'',num(c.viewers),null,Math.round((+c.viewers||0)/maxV*100)),true),
    listCard('SOOP 인기 방송','시청자 수',arr(s.soopLive).slice(0,12),(b,i)=>row(i,b.nick,[b.category,b.title].filter(Boolean).join(' · '),num(b.viewers),b.url),true),
    listCard('방송 제목 키워드',s.soopSample?'시청자 수 · 인기 방송 '+s.soopSample+'개 기준':'',arr(s.soopKeywords).slice(0,15),(k,i)=>row(i,k.word,k.count+'개 방송'+(k.isNew?' · 어제 없던 단어':k.change>0?' · 어제보다 +'+num(k.change)+'명':''),num(k.viewers)+'명'),true));
  const kr=el('div','cards');kr.id='korea';
  kr.append(
    listCard('구글 급상승 검색어','한국',arr(s.google).slice(0,12),(g,i)=>row(i,g.title,g.headline,g.traffic,g.url)),
    listCard('커뮤니티 인기글','',arr(s.community).slice(0,12),(n,i)=>row(i,n.title,n.source,'',n.url)),
    listCard('유튜브 인기 급상승','한국',arr(s.youtube).slice(0,12),(n,i)=>row(i,n.title,n.channel,'',n.url)));
  body.append(soop,kr);
}

function renderUpcoming(){
  const box=$('upcoming');box.replaceChildren();
  state.games.filter(g=>g.date>=state.today).sort((a,b)=>a.date<b.date?-1:1).slice(0,8).forEach(g=>{
    const a=el('a','up');a.href='#calendar';
    a.append(el('b','',g.title),el('span','',g.date.slice(5).replace('-','/')));
    a.onclick=()=>{state.sel=g.date;[vy,vm]=g.date.split('-').map(Number);render()};
    box.append(a)});
}
function renderUpdated(){
  const t=state.snaps[state.today]?.updatedAt;
  $('updated').textContent=state.err||(t?'마지막 수집 '+new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):state.ready?'오늘 수집 기록 없음':'불러오는 중');
}
function render(){renderCal();renderDay();renderUpcoming();renderUpdated()}

$('prev').onclick=()=>{if(--vm<1){vm=12;vy--}renderCal()};
$('next').onclick=()=>{if(++vm>12){vm=1;vy++}renderCal()};
$('todayBtn').onclick=()=>{state.today=kstToday();state.sel=state.today;[vy,vm]=state.today.split('-').map(Number);render()};
render();

const loaded={};
async function getJson(p){const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function loadMonth(y,m,force){
  const k=y+'-'+pad(m);if(loaded[k]&&!force)return;loaded[k]=true;
  try{Object.assign(state.snaps,await getJson('data/snapshots/'+k+'.json'))}catch(e){}
  state.ready=true;render();
}
async function loadGames(){
  try{const g=await getJson('data/games.json');state.games=(Array.isArray(g)?g:[]).filter(x=>x&&typeof x.date==='string'&&x.title);state.err=''}
  catch(e){state.err='출시 일정을 불러오지 못했습니다'}
  render();
}
const _rc=renderCal;renderCal=function(){_rc();loadMonth(vy,vm)};
loadGames();loadMonth(vy,vm);
setInterval(()=>{const t=kstToday().split('-').map(Number);state.today=kstToday();loadMonth(t[0],t[1],true);loadGames()},10*60*1000);
</script>

</body>
</html>
