<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>방송 트렌드 달력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 상단 바 + 왼쪽 메뉴 + 본문(월 달력 → 선택한 날의 트렌드 카드). 흰 바탕, 파란 강조, 플랫폼별 색 점 */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --line:#e4e8ef; --fg:#14171f; --muted:#69728a;
  --accent:#1a5cff; --accent-soft:#e8efff; --accent-fg:#ffffff;
  --live:#ff3b47; --chip:#eff2f7; --bar:#dbe6ff; --sun:#e5484d; --sat:#1a5cff;
  --soop:#1a5cff; --chzzk:#00c781; --twitch:#9146ff; --steam:#2a475e;
  --shadow:0 1px 2px rgba(20,23,31,.04),0 8px 24px rgba(20,23,31,.06);
  --font:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#151821; --line:#252a36; --fg:#eef0f5; --muted:#8f97aa;
  --accent:#6a9bff; --accent-soft:#18233f; --accent-fg:#0b0d12;
  --live:#ff5a64; --chip:#1f2430; --bar:#1d2f5c; --sun:#ff7a7f; --sat:#7aa6ff;
  --soop:#6a9bff; --chzzk:#1fe0a0; --twitch:#a970ff; --steam:#66c0f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#151821; --line:#252a36; --fg:#eef0f5; --muted:#8f97aa;
  --accent:#6a9bff; --accent-soft:#18233f; --accent-fg:#0b0d12;
  --live:#ff5a64; --chip:#1f2430; --bar:#1d2f5c; --sun:#ff7a7f; --sat:#7aa6ff;
  --soop:#6a9bff; --chzzk:#1fe0a0; --twitch:#a970ff; --steam:#66c0f4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--twitch));display:grid;place-items:center}
.mark::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.updated{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px;background:var(--chip);padding:5px 11px;border-radius:999px}
.updated::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.updated::before{animation:none}html{scroll-behavior:auto}}
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);max-width:1440px;margin:0 auto}
nav{position:sticky;top:57px;align-self:start;padding:20px 8px 20px 20px;display:flex;flex-direction:column;gap:2px}
nav>a{padding:10px 12px;border-radius:10px;font-weight:700;display:flex;align-items:center;gap:10px}
nav>a::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c,var(--muted))}
nav>a:hover{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
nav .sub{margin:18px 12px 6px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
nav .up{padding:7px 12px;font-size:12px;display:flex;justify-content:space-between;gap:8px;border-radius:8px;cursor:pointer}
nav .up:hover{background:var(--surface)}
nav .up b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
nav .up span{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
main{padding:20px;display:flex;flex-direction:column;gap:28px;min-width:0}
h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.03em}
.sec{font-size:15px;display:flex;align-items:center;gap:8px;margin-top:6px}
.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--c,var(--accent))}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.head .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.btn.on,.btn.on:hover{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:10px;font-size:12px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);text-align:center}
.dow div:first-child{color:var(--sun)}
.dow div:last-child{color:var(--sat)}
.day{min-height:100px;padding:7px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;
  display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}
.day:nth-child(7n){border-right:0}
.day:nth-child(7n+1) .n{color:var(--sun)}
.day:nth-child(7n) .n{color:var(--sat)}
.day.out{opacity:.35}
.day:hover{background:var(--chip)}
.day .n{font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;min-height:22px}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--live)}
.day.today .n span{background:var(--accent);color:var(--accent-fg);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.g{font-size:11px;line-height:1.35;background:var(--chip);border-radius:5px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-weight:500}
.g.kr{background:var(--accent-soft);color:var(--accent)}
.g.cn{background:color-mix(in srgb,var(--twitch) 18%,transparent);color:var(--twitch)}
.g.cn.mid{opacity:.55}
.more{font-size:11px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card h3 i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 6px;border-radius:8px}
li:hover{background:var(--chip)}
li .r{font-weight:800;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--chip)}
li:nth-child(-n+3) .r{background:var(--c,var(--accent));color:#fff}
li .t{overflow-wrap:anywhere;font-weight:500}
li .s{display:block;color:var(--muted);font-size:12px;font-weight:400}
li .v{color:var(--fg);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
li.bar{position:relative;overflow:hidden}
li.bar::before{content:"";position:absolute;inset:0;width:var(--w);background:var(--bar);z-index:0;border-radius:8px}
li.bar>*{position:relative}
.summary{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:16px;padding:14px 16px;white-space:pre-line;font-weight:500}
.empty{color:var(--muted);padding:22px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.none{color:var(--muted);font-size:12px}
.rel{display:flex;flex-direction:column;gap:8px}
.rel div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rel b{font-weight:700}
.rel span{color:var(--muted);font-size:12px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{position:static;flex-direction:row;overflow-x:auto;padding:10px 16px 0}
  nav>a{white-space:nowrap}
  nav .sub,nav #upcoming{display:none}
  main{padding:16px}
  .day{min-height:66px;padding:4px}
  .g{font-size:10px;padding:1px 4px}
  .g .pre{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark"></span>방송 트렌드 달력</div>
  <div class="updated" id="updated">불러오는 중</div>
</header>
<div class="shell">
  <nav aria-label="메뉴">
    <a href="#calendar" style="--c:var(--accent)">달력</a>
    <a href="#news" data-today style="--c:var(--live)">스트리머 소식</a>
    <a href="#soop" data-today style="--c:var(--soop)">SOOP 트렌드</a>
    <a href="#games" data-today style="--c:var(--twitch)">게임 트렌드</a>
    <a href="#food" data-today style="--c:var(--chzzk)">신메뉴</a>
    <div class="sub">다가오는 일정</div>
    <div id="upcoming"></div>
  </nav>
  <main>
    <section id="calendar">
      <div class="head" style="margin-bottom:12px">
        <h2 id="ym"></h2><span class="sp"></span>
        <button class="btn" id="prev" aria-label="이전 달">‹</button>
        <button class="btn" id="todayBtn">오늘</button>
        <button class="btn" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="cal">
        <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="legend" style="margin-top:10px">
        <span><i style="width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block"></i>트렌드 기록 있음</span>
        <span><i class="g kr" style="display:inline-block">국산</i>국내 게임사 신작</span>
        <span><i class="g" style="display:inline-block">해외</i>해외 신작</span>
        <span><i class="g cn" style="display:inline-block">시네티</i>SOOP 시네티 시작/종료</span>
      </div>
    </section>
    <section>
      <div class="head" style="margin-bottom:12px"><h2 id="selTitle"></h2></div>
      <div id="dayBody" style="display:flex;flex-direction:column;gap:16px"></div>
    </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const pad=n=>String(n).padStart(2,'0');
const kstToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());
const state={today:kstToday(),sel:kstToday(),games:[],cine:{works:[],events:[]},snaps:{},ready:false,err:'',newsCat:'전체'};
let [vy,vm]=state.today.split('-').map(Number);
const num=n=>typeof n==='number'?n.toLocaleString('ko-KR'):(n||'');
const safeUrl=u=>typeof u==='string'&&/^https:\/\//.test(u)?u:null;
const arr=x=>Array.isArray(x)?x:[];

function gamesOn(d){return state.games.filter(g=>g.date===d)}
function cineOn(d){
  const f=s=>s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):'';
  const out=[];
  state.cine.works.forEach(w=>{
    const on=w.start===d,off=w.end===d,mid=!!(w.start&&d>w.start&&(w.end?d<w.end:(w.live&&d<=state.today)));
    if(!on&&!off&&!mid)return;
    const per=(w.start?f(w.start)+(w.startTime?' '+w.startTime:''):'시작일 미상')+' ~ '+(w.end?f(w.end)+(w.endTime?' '+w.endTime:''):(w.live?'종료일 미정 (서비스 중)':'종료일 미확인'));
    out.push({title:'시네티 '+w.title,label:'시네티 '+w.title+(on?' 시작':off?' 종료':''),cls:' cn'+(mid?' mid':''),mid,url:w.url,kind:[w.kind,per,w.replay?'다시보기 '+w.replay:''].filter(Boolean).join(' · '),time:''});
  });
  state.cine.events.filter(e=>e.date===d).forEach(e=>out.push({title:e.title,label:e.title,cls:' cn',url:e.url,kind:e.kind,time:e.time}));
  return out;
}

let renderCal=function(){
  $('ym').textContent=vy+'년 '+vm+'월';
  const grid=$('grid');grid.replaceChildren();
  const first=new Date(Date.UTC(vy,vm-1,1));
  const start=new Date(first);start.setUTCDate(1-first.getUTCDay());
  const last=new Date(Date.UTC(vy,vm,0));
  const cells=Math.ceil((first.getUTCDay()+last.getUTCDate())/7)*7;
  for(let i=0;i<cells;i++){
    const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);
    const key=d.toISOString().slice(0,10);
    const b=el('button','day');b.type='button';
    if(d.getUTCMonth()!==vm-1)b.classList.add('out');
    if(key===state.today)b.classList.add('today');
    if(key===state.sel)b.classList.add('sel');
    const n=el('div','n');n.append(el('span','',d.getUTCDate()));
    if(state.snaps[key])n.append(el('i','dot'));
    b.append(n);
    const cs=cineOn(key).map(c=>({title:c.label,cls:c.cls,mid:c.mid}));
    const gs=[...cs.filter(c=>!c.mid),...gamesOn(key).map(g=>({title:g.title,cls:g.korean?' kr':''}))];
    gs.slice(0,3).forEach(g=>{const c=el('div','g'+g.cls);const pre=/ cn/.test(g.cls)&&g.title.startsWith('시네티 ');if(pre)c.append(el('span','pre','시네티 '));c.append(document.createTextNode(pre?g.title.slice(4):g.title));c.title=g.title;b.append(c)});
    if(gs.length>3)b.append(el('div','more','+'+(gs.length-3)+'개'));
    b.setAttribute('aria-label',key+(gs.length?' 일정 '+gs.length+'개':''));
    b.onclick=()=>{state.sel=key;render();if(innerWidth<=820)$('selTitle').scrollIntoView({block:'start'})};
    grid.append(b);
  }
};

function listCard(title,sub,items,row,color){
  const c=el('div','card');if(color)c.style.setProperty('--c','var(--'+color+')');
  const h=el('h3');h.append(el('i'),document.createTextNode(title));if(sub)h.append(el('small','',sub));
  c.append(h);
  if(!items.length){c.append(el('div','none','기록이 없습니다'));return c}
  const ol=el('ol');items.forEach((it,i)=>ol.append(row(it,i)));c.append(ol);return c;
}
function row(i,title,sub,val,url,barW){
  const li=el('li',barW!=null?'bar':'');if(barW!=null)li.style.setProperty('--w',barW+'%');
  li.append(el('span','r',i+1));
  const u=safeUrl(url);const t=el(u?'a':'span','t',title||'');
  if(u){t.href=u;t.target='_blank';t.rel='noopener'}
  if(sub)t.append(el('span','s',sub));
  li.append(t,el('span','v',val||''));return li;
}
function section(title,color,id){const h=el('h2','sec',title);h.id=id;h.style.setProperty('--c','var(--'+color+')');return h}

function renderDay(){
  const [y,m,d]=state.sel.split('-').map(Number);
  const dow='일월화수목금토'[new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  $('selTitle').textContent=m+'월 '+d+'일 ('+dow+')'+(state.sel===state.today?' · 오늘':'');
  const body=$('dayBody');body.replaceChildren();
  if(state.cine.notice)body.append(el('div','empty',state.cine.notice));
  const cs=cineOn(state.sel);
  if(cs.length){
    const c=el('div','card');c.style.setProperty('--c','var(--twitch)');const h=el('h3');h.append(el('i'),document.createTextNode('이날 볼 수 있는 시네티'));c.append(h);
    const r=el('div','rel');
    cs.forEach(x=>{const row=el('div');const u=safeUrl(x.url);const t=el(u?'a':'b','',x.title);if(u){t.href=u;t.target='_blank';t.rel='noopener';t.style.fontWeight='700'}
      row.append(t,el('span','',[x.kind,x.time].filter(Boolean).join(' · ')));r.append(row)});
    c.append(r);body.append(c);
  }
  const gs=gamesOn(state.sel);
  if(gs.length){
    const c=el('div','card');const h=el('h3');h.append(el('i'),document.createTextNode('이날 출시되는 게임'));c.append(h);
    const r=el('div','rel');
    gs.forEach(g=>{const row=el('div');row.append(el('b','',g.title));
      row.append(el('span','',[g.type,g.platforms,g.publisher].filter(Boolean).join(' · ')));
      if(g.note)row.append(el('span','',g.note));r.append(row)});
    c.append(r);body.append(c);
  }
  let s=state.snaps[state.sel];
  if(!s){
    const k=Object.keys(state.snaps).filter(d=>d<=state.sel).sort().pop();
    if(k){
      s=state.snaps[k];const p=k.split('-').map(Number);
      body.append(el('div','empty',(state.sel>=state.today?'아직 이날 수집 전입니다. ':'이날 수집된 기록이 없습니다. ')+'가장 최근인 '+p[1]+'월 '+p[2]+'일 기록을 보여줍니다.'));
    }
  }
  if(!s){
    body.append(el('div','empty',!state.ready?(state.err||'트렌드 기록을 불러오는 중입니다')
      :state.sel>state.today?'아직 오지 않은 날입니다. 출시 일정만 표시됩니다.'
      :'이날 수집된 트렌드 기록이 없습니다. 기록은 매시간 자동 수집되며 수집을 시작한 날부터 쌓입니다.'));
    return;
  }
  const dg=[s.summary||''];
  const rc=arr(s.soopNews).filter(n=>n.tag==='모집').slice(0,3).map(n=>n.nick+' "'+String(n.title).slice(0,24)+'"');if(rc.length)dg.push('지금 모집 중: '+rc.join(', '));
  const rs=arr(s.steamRising).slice(0,3).map(g=>String(g.name).replace(/ \(.*\)$/,''));if(rs.length)dg.push('스팀 급상승: '+rs.join(', '));
  const cz=arr(s.chzzk).slice(0,3).map(c=>c.name);if(cz.length)dg.push('치지직 인기 게임: '+cz.join(', '));
  const dtxt=dg.filter(Boolean).join('\n');if(dtxt)body.append(el('div','summary',dtxt));
  const cats=arr(s.soopCategories),maxV=Math.max(1,...cats.map(c=>+c.viewers||0));
  const soop=el('div','cards');
  soop.append(
    listCard('SOOP 인기 카테고리','시청자 수',cats.slice(0,15),(c,i)=>row(i,c.name,'',num(c.viewers),null,Math.round((+c.viewers||0)/maxV*100)),'soop'),
    listCard('SOOP 인기 방송','시청자 수',arr(s.soopLive).slice(0,12),(b,i)=>row(i,b.nick,[b.category,b.title].filter(Boolean).join(' · '),num(b.viewers),b.url),'soop'),
    listCard('방송 제목 키워드',s.soopSample?'인기 방송 '+s.soopSample+'개 기준':'',arr(s.soopKeywords).slice(0,15),(k,i)=>row(i,k.word,k.count+'개 방송'+(k.isNew?' · 어제 없던 단어':k.change>0?' · 어제보다 +'+num(k.change)+'명':''),num(k.viewers)+'명'),'soop'));
  const news=arr(s.soopNews);
  if(news.length){
    const cats=['전체',...['배그','마크','롤','스타','노래','크루모집','대회','종합게임','기획','기타'].filter(c=>news.some(n=>n.cat===c))];
    if(!cats.includes(state.newsCat))state.newsCat='전체';
    const bar=el('div','filters');
    cats.forEach(c=>{const fb=el('button','btn'+(c===state.newsCat?' on':''),c+' '+(c==='전체'?news.length:news.filter(n=>n.cat===c).length));fb.type='button';fb.onclick=()=>{state.newsCat=c;renderDay()};bar.append(fb)});
    const shown=news.filter(n=>state.newsCat==='전체'||n.cat===state.newsCat);
    const md=x=>(+x.slice(5,7))+'/'+(+x.slice(8,10));
    const nw=el('div','cards');
    nw.append(listCard('콘텐츠 공지','방송국 게시글 · 최근 5일',shown.slice(0,40),(p,i)=>row(i,p.title,[p.cat,p.tag,p.deadline?'마감 '+md(p.deadline):'',p.nick,p.viewers?'시청자 '+num(p.viewers)+'명':p.peak?'최고 시청자 '+num(p.peak)+'명':'',p.reads?'조회 '+num(p.reads):'',p.body?String(p.body).slice(0,50):''].filter(Boolean).join(' · '),String(p.date).slice(5,10).replace('-','/'),p.url),'live'));
    body.append(section('스트리머 소식','live','news'),bar,nw);
  }
  body.append(section('SOOP 트렌드','soop','soop'),soop);
  const steam=(g,i,sub)=>row(i,g.name,sub,num(g.players)+'명',g.url);
  const gm=el('div','cards');
  gm.append(
    listCard('치지직 인기 게임','시청자 수',arr(s.chzzk).slice(0,15),(c,i)=>row(i,c.name,c.count+'개 방송',num(c.viewers)+'명'),'chzzk'),
    listCard('트위치 인기 게임','전 세계',arr(s.twitch).slice(0,15),(c,i)=>row(i,c.name,'',c.viewers?num(c.viewers)+'명':''),'twitch'),
    listCard('스팀 급상승','지난주 대비 순위',arr(s.steamRising).slice(0,10),(g,i)=>steam(g,i,g.rank+'위 · '+(g.isNew?'100위권 새로 진입':g.gain+'계단 상승')),'steam'),
    listCard('스팀 동시 접속','전 세계 · 오늘 최고',arr(s.steamTop).slice().sort((a,b)=>(b.players||0)-(a.players||0)).slice(0,15),(g,i)=>steam(g,i,''),'steam'),
    listCard('스팀 최고 판매','한국',arr(s.steamSellers).slice(0,10),(g,i)=>row(i,g.name,'','',g.url),'steam'));
  if(['chzzk','twitch','steamRising','steamTop','steamSellers'].some(k=>arr(s[k]).length))body.append(section('게임 트렌드','twitch','games'),gm);
  const fd=s.food||{};
  if(arr(fd.franchise).length||arr(fd.cvs).length){
    const f=el('div','cards');const fr=(n,i)=>row(i,n.title,[n.brand,n.source].filter(Boolean).join(' · '),String(n.date||'').slice(5).replace('-','/'),n.url);
    f.append(listCard('프랜차이즈 신메뉴','최근 2주 기사',arr(fd.franchise).slice(0,15),fr,'chzzk'),listCard('편의점 신상','최근 2주 기사',arr(fd.cvs).slice(0,10),fr,'chzzk'));
    body.append(section('신메뉴','chzzk','food'),f);
  }
}

function renderUpcoming(){
  const box=$('upcoming');box.replaceChildren();
  [...state.games,...state.cine.works.filter(w=>w.start).map(w=>({title:'시네티 '+w.title,date:w.start,cn:1}))].filter(g=>g.date>=state.today).sort((a,b)=>a.date<b.date?-1:1).slice(0,10).forEach(g=>{
    const a=el('a','up');a.href='#calendar';
    a.append(el('b','',g.title),el('span','',g.date.slice(5).replace('-','/')));a.title=g.title;if(g.cn)a.firstChild.style.color='var(--twitch)';
    a.onclick=()=>{state.sel=g.date;[vy,vm]=g.date.split('-').map(Number);render()};
    box.append(a)});
}
function renderUpdated(){
  const k=Object.keys(state.snaps).sort().pop();const t=k&&state.snaps[k].updatedAt;
  const box=$('updated');
  if(state.err||!t){box.textContent=state.err||(state.ready?'수집 기록 없음':'불러오는 중');box.style.color='';return}
  const h=(Date.now()-new Date(t))/36e5;
  const ago=h<1?Math.max(1,Math.round(h*60))+'분 전':h<48?Math.round(h)+'시간 전':Math.round(h/24)+'일 전';
  box.textContent='마지막 수집 '+new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' · '+ago;
  box.style.color=h>3?'var(--live)':'';
}
function render(){renderCal();renderDay();renderUpcoming();renderUpdated()}
function goToday(){state.today=kstToday();state.sel=state.today;[vy,vm]=state.today.split('-').map(Number);render()}

$('prev').onclick=()=>{if(--vm<1){vm=12;vy--}renderCal()};
$('next').onclick=()=>{if(++vm>12){vm=1;vy++}renderCal()};
$('todayBtn').onclick=goToday;
render();
document.querySelectorAll('a[data-today]').forEach(a=>a.onclick=e=>{
  e.preventDefault();goToday();($(a.getAttribute('href').slice(1))||$('calendar')).scrollIntoView({block:'start'});
});

const loaded={};
async function getJson(p){const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function loadMonth(y,m,force){
  const k=y+'-'+pad(m);if(loaded[k]&&!force)return;loaded[k]=true;
  try{Object.assign(state.snaps,await getJson('data/snapshots/'+k+'.json'))}catch(e){}
  state.ready=true;render();
}
async function loadGames(){
  try{const g=await getJson('data/games.json');state.games=(Array.isArray(g)?g:[]).filter(x=>x&&typeof x.date==='string'&&x.title);state.err=''}
  catch(e){state.err='출시 일정을 불러오지 못했습니다'}
  try{const c=await getJson('data/cinety.json');state.cine={works:arr(c&&c.works),events:arr(c&&c.events),notice:(c&&c.notice)||''}}catch(e){}
  render();
}
const _rc=renderCal;renderCal=function(){_rc();loadMonth(vy,vm)};
loadGames();loadMonth(vy,vm);
{const p=new Date(Date.UTC(vy,vm-2,1));loadMonth(p.getUTCFullYear(),p.getUTCMonth()+1)}
setInterval(()=>{const t=kstToday().split('-').map(Number);state.today=kstToday();loadMonth(t[0],t[1],true);loadGames()},10*60*1000);
</script>
